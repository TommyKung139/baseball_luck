<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postseason Hit Luck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Base reset (the hosted preview adds this itself). */
:root { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one scorebook-style column. Scoreboard first, luck verdict second, evidence (chart, table) below.
   Color: cool paper ground, ink text, away team = blue, home team = orange (palette slots 1 and 2). */
:root {
  --bg: #f3f4f1;
  --surface: #fcfcfb;
  --ink: #101315;
  --ink2: #4d4c49;
  --muted: #6c6a64;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --hair: rgba(16, 19, 21, 0.12);
  --band: rgba(16, 19, 21, 0.045);
  --away: #2a78d6;
  --home: #eb6834;
  --away-tint: rgba(42, 120, 214, 0.38);
  --home-tint: rgba(235, 104, 52, 0.38);
  --btn: #101315;
  --btn-ink: #fcfcfb;
  --display: "Barlow Condensed", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink2: #c3c2b7;
    --muted: #a09e97;
    --grid: #2c2c2a;
    --axis: #3d3d3a;
    --hair: rgba(255, 255, 255, 0.12);
    --band: rgba(255, 255, 255, 0.05);
    --away: #3987e5;
    --home: #d95926;
    --away-tint: rgba(57, 135, 229, 0.42);
    --home-tint: rgba(217, 89, 38, 0.46);
    --btn: #f0efec;
    --btn-ink: #1a1a19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink2: #c3c2b7;
  --muted: #a09e97;
  --grid: #2c2c2a;
  --axis: #3d3d3a;
  --hair: rgba(255, 255, 255, 0.12);
  --band: rgba(255, 255, 255, 0.05);
  --away: #3987e5;
  --home: #d95926;
  --away-tint: rgba(57, 135, 229, 0.42);
  --home-tint: rgba(217, 89, 38, 0.46);
  --btn: #f0efec;
  --btn-ink: #1a1a19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; line-height: 1; letter-spacing: 0.005em; }
h2 { font-size: 26px; line-height: 1.1; }
h3 { font-size: 18px; letter-spacing: 0.02em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.tn, table, svg text { font-variant-numeric: tabular-nums; }

/* header + picker */
.top { display: flex; flex-direction: column; gap: 14px; }
.lede { color: var(--ink2); max-width: 62ch; font-size: 16px; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
select, .btn {
  font: 500 14px/1.2 var(--body);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--hair);
  border-radius: 8px;
  padding: 10px 12px;
  min-height: 42px;
}
select { flex: 1 1 280px; min-width: 0; }
.btn { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn:hover { border-color: var(--ink2); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
input[type=file]:focus-visible + .btn { outline: 2px solid var(--ink); outline-offset: 2px; }
details.help { font-size: 14px; color: var(--ink2); }
details.help summary { cursor: pointer; width: fit-content; font-weight: 500; }
details.help .body { margin-top: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; max-width: 70ch; }
details.help ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
code { font: 500 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--band); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
#msg { font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--hair); background: var(--surface); }
#msg[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px; min-width: 0; }
.scroll { overflow-x: auto; }

/* scoreboard */
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; margin-bottom: 10px; }
.meta a { color: var(--ink2); }
table.line { border-collapse: collapse; width: 100%; font-size: 15px; }
table.line th, table.line td { padding: 6px 8px; text-align: center; min-width: 30px; }
table.line thead th { font: 500 12px/1 var(--body); color: var(--muted); letter-spacing: 0.06em; padding-bottom: 8px; }
table.line th.tm { text-align: left; font: 700 22px/1 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
table.line tbody tr + tr td, table.line tbody tr + tr th { border-top: 1px solid var(--grid); }
table.line td.tot { font: 700 22px/1 var(--display); border-left: 1px solid var(--grid); }
table.line td.tot + td.tot { border-left: 0; }
table.line td.tot.r { border-left: 2px solid var(--axis); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.sw.away { background: var(--away); }
.sw.home { background: var(--home); }

/* luck */
.verdict { font-size: 18px; line-height: 1.4; max-width: 70ch; }
.verdict strong { font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 14px; }
.card .who { display: flex; align-items: center; gap: 0; }
.card .who h3 { margin: 0; }
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.big .num { font: 700 76px/0.9 var(--display); letter-spacing: -0.01em; }
.big .num small { font-size: 34px; font-weight: 600; margin-left: 2px; }
.big .band { font: 600 20px/1.1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.meter { position: relative; height: 18px; }
.meter .track { position: absolute; left: 0; right: 0; top: 5px; height: 8px; border-radius: 4px; background: var(--grid); }
.meter .mid { position: absolute; left: 50%; top: 0; width: 2px; height: 18px; margin-left: -1px; background: var(--ink2); }
.meter .dot { position: absolute; top: 0; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--ink2); }
.meter .dot.away { background: var(--away); }
.meter .dot.home { background: var(--home); }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 6px; }
dl.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; margin: 0; }
dl.stats div { min-width: 0; }
dl.stats dt { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
dl.stats dd { margin: 0; font: 600 28px/1.1 var(--display); }
.chartcap { font-size: 13px; color: var(--muted); }
.pmf { width: 100%; min-height: 150px; }
.pmf svg, #scatterSvg svg { display: block; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.key i.ring { border-radius: 50%; background: var(--surface); border: 2px solid var(--ink2); }
.key i.disc { border-radius: 50%; background: var(--ink2); }
.key i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed var(--ink); }

/* breaks */
.breaks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.breaks ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.breaks li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--grid); }
.breaks li:first-child { border-top: 0; }
.breaks .nm { font-weight: 600; }
.breaks .sub { color: var(--muted); font-size: 13px; }
.breaks .pr { font: 700 24px/1 var(--display); text-align: right; }
.breaks .pr small { display: block; font: 400 12px/1.2 var(--body); color: var(--muted); }

/* scatter */
.chartwrap { position: relative; }
#scatterSvg { width: 100%; touch-action: pan-y; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; min-width: 150px; max-width: 220px; }
.tip b { font-weight: 600; }
.tip[hidden] { display: none; }
svg text { font-family: var(--body); }
.tick { font-size: 11px; fill: var(--muted); }
.axt { font-size: 12px; fill: var(--ink2); }
.lbl { font-size: 11px; fill: var(--muted); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.pt.away.hit { fill: var(--away); stroke: var(--surface); stroke-width: 2; }
.pt.home.hit { fill: var(--home); stroke: var(--surface); stroke-width: 2; }
.pt.away.out { fill: var(--surface); stroke: var(--away); stroke-width: 2; }
.pt.home.out { fill: var(--surface); stroke: var(--home); stroke-width: 2; }
.bar.away.tint { fill: var(--away-tint); }
.bar.home.tint { fill: var(--home-tint); }
.bar.away.solid { fill: var(--away); }
.bar.home.solid { fill: var(--home); }
.bar.rest { fill: var(--grid); }
.expline { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.hl { fill: none; stroke: var(--ink); stroke-width: 1.5; }

/* table */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 14px/1 var(--body); padding: 9px 13px; border: 0; background: var(--surface); color: var(--ink2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button[aria-pressed=true] { background: var(--btn); color: var(--btn-ink); }
table.bips { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
table.bips th { text-align: left; font: 500 12px/1.2 var(--body); color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 10px; border-bottom: 2px solid var(--axis); white-space: nowrap; }
table.bips th.r, table.bips td.r { text-align: right; }
table.bips th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
table.bips th button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
table.bips td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
table.bips td.inn { white-space: nowrap; color: var(--ink2); }
table.bips td.ev { font: 700 19px/1 var(--display); }
table.bips td.ev .hh { font: 500 11px/1 var(--body); color: var(--muted); margin-left: 4px; letter-spacing: 0.04em; }
.badge { display: inline-block; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--ink2); border-radius: 4px; padding: 1px 5px; margin-left: 6px; color: var(--ink2); }
.prob { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.prob .pb { width: 56px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.prob .pb i { display: block; height: 100%; border-radius: 4px; }
.prob .pb i.away { background: var(--away); }
.prob .pb i.home { background: var(--home); }
.prob span.v { min-width: 36px; text-align: right; font-weight: 600; }
td.lk { white-space: nowrap; text-align: right; }
td.lk .w { font-size: 12px; color: var(--muted); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.tm-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
.tm-dot.away { background: var(--away); }
.tm-dot.home { background: var(--home); }
.empty { padding: 24px 6px; color: var(--muted); }

.foot { font-size: 13px; color: var(--muted); max-width: 78ch; display: flex; flex-direction: column; gap: 8px; }
.foot a { color: var(--ink2); }
@media (max-width: 520px) {
  h1 { font-size: 34px; }
  .big .num { font-size: 64px; }
  dl.stats { grid-template-columns: repeat(2, 1fr); }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter .dot { transition: left 0.4s ease; }
}

/* language button */
.titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.btn.lang { flex: none; min-height: 38px; padding: 8px 12px; white-space: nowrap; }
/* Chinese text: tighter tracking, no forced case */
:lang(zh-Hant) h1, :lang(zh-Hant) h2, :lang(zh-Hant) h3 { letter-spacing: 0.02em; text-transform: none; line-height: 1.2; }
:lang(zh-Hant) .meta, :lang(zh-Hant) .scale, :lang(zh-Hant) dl.stats dt, :lang(zh-Hant) table.bips th,
:lang(zh-Hant) table.line thead th, :lang(zh-Hant) .badge, :lang(zh-Hant) td.lk .w, :lang(zh-Hant) .big .band { letter-spacing: 0.02em; text-transform: none; }
:lang(zh-Hant) .big .band { line-height: 1.2; }
:lang(zh-Hant) .verdict, :lang(zh-Hant) .lede { line-height: 1.6; }
:lang(zh-Hant) details.help .body, :lang(zh-Hant) .foot { line-height: 1.65; }

/* seasons: green = 2026, violet = 2025 */
:root { --s2026: #0b7a55; --s2025: #5340c8; --s-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s2026: #3fd0a0; --s2025: #a99ff0; --s-ink: #101315; } }
:root[data-theme="dark"] { --s2026: #3fd0a0; --s2025: #a99ff0; --s-ink: #101315; }
.seasons { display: flex; flex-wrap: wrap; gap: 8px; }
.seasons button { --sc: var(--ink2); font: 700 24px/1 var(--display); letter-spacing: 0.02em; padding: 9px 15px 8px; border-radius: 8px; border: 2px solid var(--hair); background: var(--surface); color: var(--ink2); cursor: pointer; display: inline-flex; align-items: center; gap: 9px; }
.seasons button::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--sc); }
.seasons button[data-season="2026"] { --sc: var(--s2026); }
.seasons button[data-season="2025"] { --sc: var(--s2025); }
.seasons button .n { font: 500 12px/1 var(--body); color: var(--muted); letter-spacing: 0; }
.seasons button[aria-pressed=true] { background: var(--sc); border-color: var(--sc); color: var(--s-ink); }
.seasons button[aria-pressed=true]::before { background: var(--s-ink); }
.seasons button[aria-pressed=true] .n { color: var(--s-ink); opacity: 0.85; }
#board { border-top: 4px solid var(--sc, var(--hair)); }
select { border-left: 4px solid var(--sc, var(--hair)); }
.seasonchip { font: 700 15px/1 var(--display); letter-spacing: 0.04em; padding: 4px 9px 3px; border-radius: 6px; background: var(--sc, var(--ink2)); color: var(--s-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <h1 data-i18n="title"></h1>
      <button type="button" class="btn lang" id="langBtn"></button>
    </div>
    <p class="lede" data-i18n="lede"></p>
    <div class="seasons" id="seasonSeg" role="group" data-i18n-aria="seasonAria"></div>
    <div class="picker">
      <select id="gameSel"></select>
      <input type="file" id="gameFile" accept=".json,.html,.txt,application/json" multiple>
      <label for="gameFile" class="btn" data-i18n="preview" data-i18n-title="previewTip"></label>
      <button type="button" class="btn" id="removeBtn" hidden data-i18n="removePreview"></button>
    </div>
    <div id="msg" role="status" aria-live="polite" hidden></div>
  </header>

  <section class="panel" id="board" data-i18n-aria="sbAria"></section>

  <section id="luckSec" style="display:flex;flex-direction:column;gap:14px">
    <h2 data-i18n="luckTitle"></h2>
    <p class="verdict" id="verdict"></p>
    <div class="cards" id="cards"></div>
    <details class="help">
      <summary data-i18n="methodSummary"></summary>
      <div class="body">
        <ol>
          <li data-i18n="m1"></li>
          <li data-i18n="m2"></li>
          <li data-i18n="m3"></li>
          <li data-i18n="m4"></li>
        </ol>
        <p style="margin-top:8px" data-i18n-html="mPct"></p>
        <p style="margin-top:8px" class="muted" data-i18n="mNote"></p>
      </div>
    </details>
  </section>

  <section class="breaks" id="breaks" data-i18n-aria="breaksAria"></section>

  <section class="panel" id="scatterPanel" data-i18n-aria="scatterPanelAria">
    <h2 data-i18n="scatterTitle"></h2>
    <p class="chartcap" style="margin-top:4px" data-i18n="scatterCap"></p>
    <div class="key" id="scatterKey" style="margin:12px 0 6px"></div>
    <div class="chartwrap">
      <div id="scatterSvg"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>

  <section class="panel" id="tablePanel" data-i18n-aria="tableAria">
    <h2 data-i18n="tableTitle"></h2>
    <div class="toolbar">
      <div class="seg" role="group" data-i18n-aria="scopeAria">
        <button type="button" data-scope="hits" aria-pressed="true" data-i18n="scopeHits"></button>
        <button type="button" data-scope="all" aria-pressed="false" data-i18n="scopeAll"></button>
      </div>
      <div class="seg" role="group" data-i18n-aria="teamAria" id="teamSeg"></div>
    </div>
    <div class="scroll"><table class="bips" id="tbl"></table></div>
  </section>

  <footer class="foot">
    <p data-i18n="footData"></p>
    <p id="srcLink"></p>
  </footer>
</div>

<script src="core.js"></script>

    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  $('#removeBtn').addEventListener('click', function () {
    var g = cur(); if (!g || g.builtin) return;
    state.games = state.games.filter(function (x) { return x.pk !== g.pk; });
    saveGames(); say([['removed']]);
    selectSeason(state.season);
  });
  $('#langBtn').addEventListener('click', function () { setLang(zh() ? 'en' : 'zh'); });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    if (btn.hasAttribute('data-season')) {
      say(null); selectSeason(parseInt(btn.getAttribute('data-season'), 10));
    } else if (btn.hasAttribute('data-scope')) {
      state.scope = btn.getAttribute('data-scope');
      [].forEach.call(document.querySelectorAll('[data-scope]'), function (x) { x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'); });
      renderTable();
    } else if (btn.hasAttribute('data-team')) {
      state.team = btn.getAttribute('data-team'); renderTeamSeg(); renderTable();
    } else if (btn.hasAttribute('data-sort')) {
      var k = btn.getAttribute('data-sort');
      if (state.sortKey === k) state.sortDir = -state.sortDir;
      else { state.sortKey = k; state.sortDir = (k === 'order' || k === 'batter' || k === 'event') ? 1 : -1; }
      renderTable();
    }
  });
  var sv = $('#scatterSvg');
  sv.addEventListener('pointermove', onScatterMove);
  sv.addEventListener('pointerdown', onScatterMove);
  sv.addEventListener('pointerleave', onScatterLeave);

  var lastW = 0, raf = 0;
  function onResize() {
    var w = Math.round($('.wrap').clientWidth);
    if (w === lastW) return;
    lastW = w;
    if (!ready()) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { drawScatter(); drawPmfs(); });
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe($('.wrap'));
  else window.addEventListener('resize', onResize);

  /* ---------- loading games from the site ---------- */
  function setSections(show) {
    ['luckSec', 'breaks', 'scatterPanel', 'tablePanel'].forEach(function (id) { $('#' + id).hidden = !show; });
  }
  function showEmpty() {
    setSections(false);
    renderPicker();
    $('#board').innerHTML = '<p class="empty">' + t('empty') + '</p>';
  }
  function showEmptySeason() {
    state.sel = null; state.emptySeason = true;
    setSections(false);
    renderPicker();
    $('#board').innerHTML = '<p class="empty">' + esc(t('seasonEmpty', { y: state.season })) + '</p>';
  }
  function renderIdle() {
    if (!state.games.length) showEmpty();
    else if (state.emptySeason) showEmptySeason();
  }
  function selectSeason(y) {
    state.season = y; state.team = 'all';
    var list = gamesIn(y);
    if (list.length) selectGame(list[0].pk); else showEmptySeason();
  }
  function findGame(pk) {
    for (var i = 0; i < state.games.length; i++) if (state.games[i].pk === pk) return i;
    return -1;
  }
  function ensure(pk) {
    var i = findGame(pk);
    if (i < 0) return Promise.reject(new Error('missing'));
    var g = state.games[i];
    if (g.bip) return Promise.resolve(g);
    return fetch('games/' + encodeURIComponent(pk) + '.json').then(function (r) {
      if (!r.ok) throw new Error('http');
      return r.json();
    }).then(function (full) {
      full.builtin = true;
      full.note = g.note || '';
      state.games[findGame(pk)] = full;
      return full;
    });
  }
  function selectGame(pk) {
    state.sel = pk; state.team = 'all'; state.emptySeason = false;
    var gi = findGame(pk);
    if (gi >= 0) state.season = seasonOf(state.games[gi]);
    renderPicker();
    if (!ready()) { setSections(false); $('#board').innerHTML = '<p class="empty">' + t('loading') + '</p>'; }
    ensure(pk).then(function () { setSections(true); renderAll(); }).catch(function () {
      say([['loadErr']]);
    });
  }
  function boot() {
    applyStatic();
    var saved = loadSaved();
    fetch('games/manifest.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('http');
      return r.json();
    }).then(function (list) {
      (Array.isArray(list) ? list : []).forEach(function (e) { e.builtin = true; state.games.push(e); });
    }).catch(function () {
      say([['manifestErr']]);
    }).then(function () {
      saved.forEach(function (g) { if (findGame(g.pk) < 0) state.games.push(g); });
      if (!state.games.length) { state.season = SEASONS_SHOWN[0]; showEmpty(); return; }
      selectGame(state.games[0].pk);
    });
  }
  boot();
  lastW = Math.round($('.wrap').clientWidth);
})();
</script>
</body>
</html>
